services:
  - type: web
    name: waterman
    env: node
    buildCommand: npm install && npx puppeteer browsers install chrome && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_CONVEX_URL
        sync: false

  - type: web
    name: waterman-recorder
    env: node
    buildCommand: npm install && curl -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ --strip-components=2 -C /usr/local/bin ffmpeg-master-latest-linux64-gpl/bin/ffmpeg
    startCommand: node scripts/recorder-worker.mjs
    envVars:
      - key: NEXT_PUBLIC_CONVEX_URL
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: RECORDER_WORKER_SECRET
        sync: false

  - type: cron
    name: waterman-scraper
    schedule: "0 0,6,12,18 * * *"  # Run at midnight, 6 AM, noon, and 6 PM UTC (4 times per day)
    env: node
    buildCommand: npm install && tes
    startCommand: node scripts/scrape.mjs
    envVars:
      - key: NEXT_PUBLIC_CONVEX_URL
        sync: false

  - type: cron
    name: waterman-fx-openmeteo
    schedule: "30 * * * *"
    env: node
    buildCommand: npm install
    startCommand: npm run fx:fetch:openmeteo
    envVars:
      - key: NEXT_PUBLIC_CONVEX_URL
        sync: false

  - type: cron
    name: waterman-fx-labels
    schedule: "10 * * * *"
    env: node
    buildCommand: npm install
    startCommand: npm run fx:build:labels && npm run fx:score:models && npm run fx:predict
    envVars:
      - key: NEXT_PUBLIC_CONVEX_URL
        sync: false

  - type: worker
    name: waterman-fx-observations
    env: node
    buildCommand: npm install
    startCommand: sh -c 'while true; do npm run fx:fetch:observations; sleep ${FX_OBSERVATION_POLL_SECONDS:-300}; done'
    envVars:
      - key: NEXT_PUBLIC_CONVEX_URL
        sync: false
      - key: FX_OBSERVATION_POLL_SECONDS
        value: "300"

