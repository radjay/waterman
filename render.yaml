services:
  - type: web
    name: waterman
    env: node
    buildCommand: npm install && npx puppeteer browsers install chrome && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_CONVEX_URL
        sync: false

  - type: cron
    name: waterman-scraper
    schedule: "0 0,6,12,18 * * *"  # Run at midnight, 6 AM, noon, and 6 PM UTC (4 times per day)
    env: node
    buildCommand: npm install
    startCommand: node scripts/scrape.mjs
    envVars:
      - key: NEXT_PUBLIC_CONVEX_URL
        sync: false

  - type: cron
    name: waterman-fx-openmeteo
    schedule: "30 * * * *"
    env: node
    buildCommand: npm install
    startCommand: npm run fx:fetch:openmeteo
    envVars:
      - key: NEXT_PUBLIC_CONVEX_URL
        sync: false
      - key: FX_FORECAST_DAYS
        value: "7"

  - type: cron
    name: waterman-fx-labels
    schedule: "10 * * * *"
    env: node
    buildCommand: npm install
    # Scores stored predictions vs daily labels (kick-in MAE, rideable hit/miss).
    # Could move fx:score:predictions to a weekly cron if hourly is too frequent.
    # Phase 2 pragmatic shipping (as of 2026-05): generator now defaults to v3.5 (with conservative sessionThreshold for day-ahead Forecast layer).
    # No FX_PREDICTION_VERSION env var here → service picks the code default (v3.5 + conservative for planning horizons) after next deploy.
    # Deploy of current code (or explicitly adding FX_PREDICTION_VERSION=v3.5) completes plan task 2.1 on the worker side.
    # Phase 5 Nowcast (same-day, frequent re-runs for "today" when fresh Cabo) may later need a separate or higher-frequency job.
    startCommand: npm run fx:build:labels && npm run fx:score:models && npm run fx:score:predictions && npm run fx:predict
    envVars:
      - key: NEXT_PUBLIC_CONVEX_URL
        sync: false
      - key: FX_PREDICTION_VERSION
        value: "v3.5"  # Locks in pragmatic default (v3.5 + conservative for day-ahead Forecast). Completes the worker-side step for plan task 2.1.
    # Monitoring note (Phase 5 future): once dedicated nowcast scoring lands, add a separate cron or flag to run fx:score:predictions with mode split (nowcast vs day-ahead) for drift tracking. Current workerRun metadata already carries rerunRecommendation for observability.

  - type: worker
    name: waterman-fx-observations
    env: node
    buildCommand: npm install
    startCommand: sh -c 'while true; do npm run fx:fetch:observations; sleep ${FX_OBSERVATION_POLL_SECONDS:-300}; done'
    envVars:
      - key: NEXT_PUBLIC_CONVEX_URL
        sync: false
      - key: FX_OBSERVATION_POLL_SECONDS
        value: "300"

  # Phase 5 5.2 safety-net cron for Nowcast (same-day tightening).
  # Runs every 15–30 min. The generator (fx-generate-predictions) is already
  # cheap to no-op when there is no fresh Cabo for "today" or the local day
  # is not the forecast date. This guarantees progress even if the primary
  # event-driven path (from the observations worker) is delayed.
  # The observations worker now also triggers an immediate nowcast run
  # when fresh Cabo for today is ingested (event-driven primary path).
  - type: cron
    name: waterman-fx-nowcast
    schedule: "*/20 * * * *"
    env: node
    buildCommand: npm install
    startCommand: FX_PREDICTION_LAYERS=nowcast npm run fx:predict
    envVars:
      - key: NEXT_PUBLIC_CONVEX_URL
        sync: false
      - key: FX_PREDICTION_VERSION
        value: "v3.5"

